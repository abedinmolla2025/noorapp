    <script>
      // Global error handler for resource loading and CSP violations
      (function() {
        function forceReload() {
          console.log('Stability issue detected, clearing cache and reloading...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for(let registration of registrations) { registration.unregister(); }
            });
          }
          // Clear all caches if possible
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) caches.delete(name);
            });
          }
          window.location.reload(true);
        }

        window.addEventListener('error', function(e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            const src = e.target.src || e.target.href;
            console.error('Resource load error:', src);
            if (e.message && (e.message.includes('MIME type') || e.message.includes('chunk'))) {
              forceReload();
            }
          }
        }, true);

        window.addEventListener('securitypolicyviolation', function(e) {
          console.error('CSP Violation:', e.blockedURI);
          // If a critical domain like aladhan or openstreetmap is blocked, it means CSP is stale
          if (e.blockedURI && (e.blockedURI.includes('aladhan') || e.blockedURI.includes('openstreetmap'))) {
            forceReload();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW registered:', reg.scope);
            
            // Check for updates every hour
            setInterval(() => {
              reg.update();
            }, 60 * 60 * 1000);

            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New content is available, but the old SW is still in control.
                    // We can notify the user or just let the ErrorBoundary/Reload logic handle it
                    // when they click a missing chunk.
                    console.log('New content available, please refresh.');
                  }
                };
              }
            };
          }).catch(err => {
            console.warn('SW registration failed:', err);
          });
        });

        // Handle controller change (new SW takes over)
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
