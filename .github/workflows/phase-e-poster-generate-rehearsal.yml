# Poster generation (REHEARSAL ONLY)
#
# Generates a poster for ONE already-approved daily-content publication
# in the REHEARSAL project (cazdbxxffvdnsdatjsrx) and uploads it to the
# rehearsal bucket `daily-content-posters`.
#
# The generator is a deterministic placeholder: it renders a 1080x1080
# SVG with the publication title (layout + palette fixed by
# src/scripts/generate_poster.py) and the caller-chosen scene mode, then
# converts it to PNG with rsvg-convert. It makes NO model or API call
# and therefore cannot produce a real illustrated poster; it exists to
# exercise the full pipeline (publish -> generate -> upload -> verify)
# end to end before a real generator is wired in. A model-backed
# generator needs a separate owner-approved workflow.
#
# REHEARSAL ONLY. There is no target input and no production path in this
# file: the DB guard refuses any URL that is not the rehearsal pooler
# (aws-1-ap-southeast-1, postgres.cazdbxxffvdnsdatjsrx), and the storage
# guard checks the project ref before any upload. A production run
# needs a separate owner-approved workflow.
#
# By default this is a DRY RUN: it generates the poster and reports its
# checksum, but uploads nothing and updates no database row. Pass
# dry_run=false only to write the result to the rehearsal bucket and row.
#
# Secrets required (repository secrets, created by the owner):
#   REHEARSAL_DB_URL — the rehearsal session-pooler connection string.
#     The URL is validated exactly (host/user/port/db, last-'@' rule —
#     see the guard step) and never echoed; only the validated host is
#     printed. The password is masked with ::add-mask::.
#   REHEARSAL_SUPABASE_URL — the rehearsal project URL, e.g.
#     https://cazdbxxffvdnsdatjsrx.supabase.co
#   REHEARSAL_SERVICE_ROLE_KEY — the rehearsal service-role key, used
#     ONLY by the Supabase CLI for the rehearsal upload (never echoed).

name: Poster Generation (rehearsal only)

on:
  workflow_dispatch:
    inputs:
      publication_id:
        description: 'Publication UUID to generate a poster for'
        required: true
        type: string
      scene_mode:
        description: 'Scene mode (auto | minimal | rich)'
        required: true
        type: choice
        options: [auto, minimal, rich]
        default: auto
      dry_run:
        description: 'Dry run (generate only, no upload, no DB update)'
        required: true
        type: boolean
        default: true
      bucket_path:
        description: 'Storage path inside daily-content-posters (required unless dry_run)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  generate-poster:
    runs-on: ubuntu-latest
    env:
      REHEARSAL_DB_URL: ${{ secrets.REHEARSAL_DB_URL }}
      REHEARSAL_SUPABASE_URL: ${{ secrets.REHEARSAL_SUPABASE_URL }}
      REHEARSAL_SERVICE_ROLE_KEY: ${{ secrets.REHEARSAL_SERVICE_ROLE_KEY }}
      PUBLICATION_ID: ${{ inputs.publication_id }}
      SCENE_MODE: ${{ inputs.scene_mode }}
      DRY_RUN: ${{ inputs.dry_run }}
      BUCKET_PATH: ${{ inputs.bucket_path }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$PUBLICATION_ID" in
            ''|*[!0-9a-fA-F-]*) echo "publication_id must be a UUID."; exit 1 ;;
          esac
          case "$SCENE_MODE" in
            auto|minimal|rich) ;;
            *) echo "scene_mode must be auto, minimal or rich."; exit 1 ;;
          esac
          if [ "$DRY_RUN" = "false" ] && [ -z "$BUCKET_PATH" ]; then
            echo "bucket_path is required when dry_run is false."; exit 1
          fi
          if [ "$DRY_RUN" = "true" ] && [ -n "$BUCKET_PATH" ]; then
            echo "Dry-run must not set BUCKET_PATH."
            exit 1
          fi
          case "$BUCKET_PATH" in
            *'..'*|/*|*' '*) echo "bucket_path must be a relative path without spaces or '..'."; exit 1 ;;
          esac
          echo "Inputs valid."

      - name: Require secrets
        run: |
          set -euo pipefail
          if [ -z "$REHEARSAL_DB_URL" ]; then echo "REHEARSAL_DB_URL secret is missing."; exit 1; fi
          if [ -z "$REHEARSAL_SUPABASE_URL" ]; then echo "REHEARSAL_SUPABASE_URL secret is missing."; exit 1; fi
          if [ -z "$REHEARSAL_SERVICE_ROLE_KEY" ]; then echo "REHEARSAL_SERVICE_ROLE_KEY secret is missing."; exit 1; fi
          echo "Required secrets present."

      - name: Guard - exact rehearsal DB URL validation
        run: |
          set -euo pipefail
          # Same exact-parse guard as d1-migrate.yml (rehearsal leg):
          # host, port, username, password, database checked separately;
          # the other project's ref must not appear anywhere in the URL;
          # the authority is split at the LAST '@' (libpq's rule).
          # The URL and the password are never echoed; only the validated
          # host (public knowledge) is printed.
          EXPECTED_REF="cazdbxxffvdnsdatjsrx"
          OTHER_REF="llicfiepatzgllmjhzbw"
          EXPECTED_HOST="aws-1-ap-southeast-1.pooler.supabase.com"
          URL="$REHEARSAL_DB_URL"
          EXPECTED_USER="postgres.${EXPECTED_REF}"
          URL="${URL#"${URL%%[![:space:]]*}"}"
          URL="${URL%"${URL##*[![:space:]]}"}"
          case "$URL" in
            *[[:space:]]*) echo "Malformed database URL (whitespace inside the URL). Refusing."; exit 1 ;;
          esac
          case "$URL" in
            *"$OTHER_REF"*) echo "URL contains the production ref. Refusing."; exit 1 ;;
          esac
          case "$URL" in
            postgresql://*) REST="${URL#postgresql://}" ;;
            postgres://*) REST="${URL#postgres://}" ;;
            *) echo "Malformed database URL (scheme must be postgresql:// or postgres://). Refusing."; exit 1 ;;
          esac
          AUTH="${REST%%[/?#]*}"
          TAIL="${REST#"$AUTH"}"
          HOSTPORT="${AUTH##*@}"
          USERINFO="${AUTH%@*}"
          if [ "$HOSTPORT" = "$AUTH" ]; then
            echo "Malformed database URL (missing userinfo). Refusing."
            exit 1
          fi
          DB_USER="${USERINFO%%:*}"
          case "$USERINFO" in
            *:* ) DB_PASS="${USERINFO#*:}" ;;
            * ) echo "Missing database password. Refusing."; exit 1 ;;
          esac
          DB_HOST="${HOSTPORT%%:*}"
          DB_PORT="${HOSTPORT#*:}"
          if [ "$DB_PORT" = "$HOSTPORT" ]; then DB_PORT=""; fi
          DB_PATH="${TAIL%%\?*}"
          [ "$DB_HOST" = "$EXPECTED_HOST" ] || { echo "Unexpected database host: got '$DB_HOST', expected '$EXPECTED_HOST'. Refusing."; exit 1; }
          [ "$DB_PORT" = "5432" ] || { echo "Unexpected database port: got '$DB_PORT' (must be 5432). Refusing."; exit 1; }
          [ "$DB_USER" = "$EXPECTED_USER" ] || { echo "Unexpected database username: got '$DB_USER', expected '$EXPECTED_USER'. Refusing."; exit 1; }
          [ -n "$DB_PASS" ] || { echo "Missing database password. Refusing."; exit 1; }
          [ "$DB_PATH" = "/postgres" ] || { echo "Unexpected database name: got '$DB_PATH' (must be /postgres). Refusing."; exit 1; }
          echo "Target host OK (rehearsal, $DB_HOST)."
          echo "::add-mask::$DB_PASS"
          {
            echo "PGHOST=$DB_HOST"
            echo "PGPORT=$DB_PORT"
            echo "PGUSER=$DB_USER"
            echo "PGPASSWORD=<redacted>"
            echo "PGDATABASE=postgres"
          } >> "$GITHUB_ENV"
          echo "PG* connection vars set (host $DB_HOST, user $DB_USER)."

      - name: Guard - rehearsal Supabase URL
        run: |
          set -euo pipefail
          EXPECTED_URL="https://cazdbxxffvdnsdatjsrx.supabase.co"
          if [ "$REHEARSAL_SUPABASE_URL" != "$EXPECTED_URL" ]; then
            echo "REHEARSAL_SUPABASE_URL must be $EXPECTED_URL. Refusing."
            exit 1
          fi
          echo "Supabase URL OK (rehearsal)."

      - name: Checkout generator + SQL
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/scripts/generate_poster.py
            supabase/migrations/202611150001_daily_content_posters.sql
          sparse-checkout-cone-mode: false

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client librsvg2-bin
          node --version
          python3 --version

      - name: Fetch publication
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          ROW=$(psql --variable ON_ERROR_STOP=1 --no-align --tuples-only --field-separator='|' -c "select id, status, title_en from public.daily_content_publications where id='$PUBLICATION_ID'::uuid;")
          [ -n "$ROW" ] || { echo "No publication found for id $PUBLICATION_ID."; exit 1; }
          TITLE=$(printf '%s' "$ROW" | cut -d'|' -f3)
          STATUS=$(printf '%s' "$ROW" | cut -d'|' -f2)
          [ -n "$TITLE" ] || { echo "Publication $PUBLICATION_ID has no title_en."; exit 1; }
          echo "Publication $PUBLICATION_ID: $TITLE (status $STATUS)"
          printf '%s' "$TITLE" > title.txt
          echo "TITLE<<EOF" >> "$GITHUB_ENV"
          cat title.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Generate poster (placeholder SVG -> PNG)
        run: |
          set -euo pipefail
          python3 src/scripts/generate_poster.py --title-file title.txt --scene-mode "$SCENE_MODE" --out poster.svg
          rsvg-convert -w 1080 -h 1080 poster.svg -o poster.png
          file poster.png
          identify poster.png 2>/dev/null || true
          CHECKSUM=$(sha256sum poster.png | cut -d' ' -f1)
          echo "poster.png sha256: $CHECKSUM"
          echo "POSTER_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "POSTER_BYTES=$(stat -c%s poster.png)" >> "$GITHUB_ENV"

      - name: Upload to rehearsal bucket
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          echo "::add-mask::$REHEARSAL_SERVICE_ROLE_KEY"
          npx --yes supabase@2.39.2 --version
          echo "$REHEARSAL_SERVICE_ROLE_KEY" | npx --yes supabase@2.39.2 link --project-ref cazdbxxffvdnsdatjsrx
          npx --yes supabase@2.39.2 storage ls daily-content-posters --experimental 2>&1 | head -20
          npx --yes supabase@2.39.2 storage cp poster.png "daily-content-posters/$BUCKET_PATH" --experimental
          echo "Uploaded to daily-content-posters/$BUCKET_PATH"

      - name: Update publication row (non-dry-run only)
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          POSTER_URL="https://cazdbxxffvdnsdatjsrx.supabase.co/storage/v1/object/public/daily-content-posters/$BUCKET_PATH"
          SCENE_ID=$(python3 - <<'PY'
          import hashlib, pathlib
          title = pathlib.Path("title.txt").read_text(encoding="utf-8").strip()
          print(f"scene-{(hashlib.sha256(title.encode()).hexdigest()[:4])}")
          PY
          )
          echo "Scene ID $SCENE_ID"
          psql --variable ON_ERROR_STOP=1 --single-transaction <<SQL
          update public.daily_content_publications
             set poster_storage_path = '$BUCKET_PATH',
                 poster_url = '$POSTER_URL',
                 poster_checksum = '$POSTER_CHECKSUM',
                 poster_scene_id = '$SCENE_ID',
                 poster_qc_status = 'pending',
                 poster_generated_at = now()
           where id = '$PUBLICATION_ID'::uuid;
          SQL
          echo "Publication row updated."

      - name: Verify
        run: |
          set -euo pipefail
          export PGSSLMODE=require
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: poster generated, checksum $POSTER_CHECKSUM, size $POSTER_BYTES bytes. Nothing uploaded, no row updated."
            exit 0
          fi
          ROW=$(psql --variable ON_ERROR_STOP=1 --no-align --tuples-only --field-separator='|' -c "select poster_storage_path, poster_url, poster_checksum, poster_scene_id, poster_qc_status from public.daily_content_publications where id='$PUBLICATION_ID'::uuid;")
          echo "Row: $ROW"
          [ "$(printf '%s' "$ROW" | cut -d'|' -f1)" = "$BUCKET_PATH" ] || { echo "poster_storage_path mismatch."; exit 1; }
          [ "$(printf '%s' "$ROW" | cut -d'|' -f3)" = "$POSTER_CHECKSUM" ] || { echo "poster_checksum mismatch."; exit 1; }
          [ "$(printf '%s' "$ROW" | cut -d'|' -f5)" = "pending" ] || { echo "poster_qc_status is not pending."; exit 1; }
          echo "Verified: poster uploaded and row updated for $PUBLICATION_ID."
