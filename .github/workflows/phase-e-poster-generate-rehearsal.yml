# Daily Content Poster Generation (rehearsal)
#
# Stage 1–3 of the 4-stage Daily Content pipeline, rehearsal only:
#   1. POSTER GENERATION — render the real OgShareCard component
#      (Dua OG visual identity) headlessly with Playwright/Chromium,
#      from the publication row (verbatim text, never invented).
#      SPLIT FLOW (Phase 3, Master Mission): the row is usually
#      `planned` (created by the daily function with `plan_only`) —
#      the pre-check reads it with the admin JWT (anon RLS cannot see
#      a planned row; the "Admins read publications" policy already
#      covers it) and writes its cards to `poster-out/plan.json`,
#      which the render page loads as `?plan=1`. A `published` row
#      (legacy path) still renders from the anon read as before.
#   2. IMAGE QC — the render page runs checkOgCardBatch + a verbatim
#      character check against the publication card; the render script
#      verifies exact export dimensions + non-trivial file size.
#      A QC failure stops the pipeline: no upload, no URL persisted.
#   3. POSTER ASSET FINALIZATION — upload the PNG(s) to the
#      `daily-content-posters` Storage bucket (deterministic path
#      <kolkata_date>/<format>.png, upsert) and persist the finalized
#      asset (asset ID, storage path, public URL, SHA-256 checksum,
#      QC status) on the publication row via the daily-content
#      `set_poster` action (which now accepts planned rows).
#      Then the PUBLISH step calls `publish_planned`: the row flips to
#      `published` and the first push goes out WITH the poster image.
#      The function refuses a row whose poster is not QC-passed, so a
#      poster failure leaves the row planned — downstream has nothing
#      to distribute that day.
#
# Adaptive multi-page (2026-11-22, owner brief — merged to main 2026-11-22):
# the render page selects a layout mode from the card's measured fit
# (`?adaptive=1`): single / extended_single (1 page), multi_page
# (2–3 pages, sentence-boundary splits, whole-set coverage gate), or
# full_reading_link (1 intro page + link). This workflow PROBES with a
# portrait page-1 adaptive render to learn the mode + pageCount, then
# renders every (page, format) pair; the probe PNG is page-1 portrait
# and is reused, never re-rendered. Page 1 keeps the existing storage
# layout (<date>/<format>.png); pages 2–3 upload to
# <date>/<format>-p2.png / -p3.png and land in the existing
# poster_urls / poster_checksums maps under keys <format>-p2 / -p3
# (the function accepts them; page-1 portrait stays poster_url, so
# the publish / push / homepage chain works unchanged). Finalize
# asserts ONE backgroundId across ALL renders; ANY failed page or
# format fails the WHOLE set (set_poster failed, never a partial set).
# Compare mode stays non-adaptive (single render per format, as before).
#
# Stage 4 (Downstream Distribution — homepage image, push image,
# WhatsApp/Native Share, Facebook Page) reads the finalized asset.
# The homepage already reads `poster_url` (Phase 3); push carries the
# image on the first send through the split flow above. Share and
# Facebook wiring is separate work.
#
# REHEARSAL ONLY. Target is hardcoded to cazdbxxffvdnsdatjsrx.
# Manual dispatch only (no schedule — scheduled runs only fire from
# the default branch; a 00:45 UTC schedule is a one-line addition for
# the merge-to-main step). The workflow never touches production.
#
# Idempotency: the pre-check exits 0 (nothing to do) when the
# publication already has a QC-passed poster; Storage uploads use
# deterministic paths with upsert; `set_poster` refuses to overwrite
# a passed poster without force. Re-running for the same date is safe.
#
# Comparison mode (`compare: true`, layout a/b/c): renders the
# Bengali-first variants side by side WITHOUT touching the publication
# row — the pre-check's idempotent skip is bypassed, PNGs upload to
# `<kolkata_date>/compare/<layout>-<format>.png`, and the set_poster
# finalization + publish steps are skipped. Standard template is
# layout "c" (Bengali Panel + Arabic Footnote, Master Mission Phase 2
# decision 2026-11-16); compare mode stays available for A/B checks.
#
# Failure: any render/upload/QC failure records `poster_qc_status=
# 'failed'` + a short reason on the publication row (never a poster
# URL) and exits non-zero. A planned row stays planned (never
# published); a published row stays published (text-only).
# Downstream MUST NOT proceed on a failed poster. A second failure
# on the same Kolkata day quarantines the row (see Hold/Quarantine
# below) — no automatic attempt retries it.
#
# Hold/Quarantine (Phase 3 — Hold/Quarantine + self-healing):
# a poster failure HELDS the day: the row stays planned, and
# `publish_planned` refuses it (409 `poster_not_ready`), so the day
# is never published text-only. The heal tick (retry workflow with
# `heal: true`) dispatches this workflow again for a held row. A
# second failure on the same Kolkata day QUARANTINES the row — the
# function stores the reason with a `quarantined:` prefix, and the
# pre-check below skips a quarantined row cleanly (exit 3,
# "QUARANTINED — needs review") with no render. A quarantined row
# needs owner/admin review (force re-run or skip the day). The
# `force` input bypasses ONLY the quarantine skip — never the
# passed-poster skip. A successful `set_poster` pass clears the
# error and ends the hold (the E2E recovery path).
#
# In-run bounded retry (Phase 3): render-poster.mjs and
# upload-poster.mjs each retry a TRANSIENT failure once (max 2
# attempts, 5 s apart) and never retry a deterministic one
# (page QC error, dimension/size mismatch, invalid credentials).
# The result JSON carries `attempts` (1 or 2).
#
# Secrets required (repository secrets, created by the owner):
#   REHEARSAL_ANON_KEY, REHEARSAL_ADMIN_EMAIL, REHEARSAL_ADMIN_PASSWORD
#   (Storage upload as admin; the pre-check also reads the publication
#   row with the admin JWT, which can see planned rows), REHEARSAL_CRON_SECRET
#   (set_poster + publish_planned calls).
# Secrets are masked with ::add-mask:: immediately and are NEVER
# echoed, logged, or written to any file.

name: Daily Content Poster Generation (rehearsal)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type true to generate the poster for the rehearsal publication'
        required: true
        type: boolean
        default: false
      kolkata_date:
        description: 'Kolkata date (YYYY-MM-DD) of the published publication; empty = today'
        required: false
        type: string
        default: ''
      formats:
        description: 'Comma-separated formats to render (portrait,square,wide,story)'
        required: false
        type: string
        default: 'portrait,square'
      layout:
        description: 'Poster layout: c (standard — Bengali Panel + Arabic Footnote), a/b (Bengali-first overrides), legacy (Arabic-first, explicit only)'
        required: false
        type: choice
        default: 'c'
        options: [legacy, a, b, c]
      compare:
        description: 'Comparison mode: render to <date>/compare/<layout>-<format>.png and skip set_poster finalization (never touches the publication row)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force: re-attempt a QUARANTINED row (poster failed twice). Bypasses ONLY the quarantine skip — never the passed-poster skip. Default false.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-poster:
    runs-on: ubuntu-latest
    env:
      REHEARSAL_URL: https://cazdbxxffvdnsdatjsrx.supabase.co
      REHEARSAL_ANON_KEY: ${{ secrets.REHEARSAL_ANON_KEY }}
      REHEARSAL_ADMIN_EMAIL: ${{ secrets.REHEARSAL_ADMIN_EMAIL }}
      REHEARSAL_ADMIN_PASSWORD: ${{ secrets.REHEARSAL_ADMIN_PASSWORD }}
      REHEARSAL_CRON_SECRET: ${{ secrets.REHEARSAL_CRON_SECRET }}
    steps:
      - name: Validate inputs and secrets
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "true" ]; then
            echo "confirm must be true for a manual run; aborting."
            exit 1
          fi
          for s in REHEARSAL_ANON_KEY REHEARSAL_ADMIN_EMAIL REHEARSAL_ADMIN_PASSWORD REHEARSAL_CRON_SECRET; do
            if [ -z "${!s}" ]; then echo "$s secret is not set."; exit 1; fi
          done
          echo "::add-mask::$REHEARSAL_ANON_KEY"
          echo "::add-mask::$REHEARSAL_ADMIN_PASSWORD"
          echo "::add-mask::$REHEARSAL_CRON_SECRET"
          if [ -n "${{ inputs.kolkata_date }}" ]; then
            case "${{ inputs.kolkata_date }}" in
              ????-??-??) ;;
              *) echo "kolkata_date must be YYYY-MM-DD."; exit 1 ;;
            esac
          fi
          echo "Inputs validated; secrets present (values never shown)."
          echo "Target: rehearsal only (cazdbxxffvdnsdatjsrx)."

      - name: Checkout poster branch code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Resolve date and pre-check publication
        id: precheck
        env:
          COMPARE: ${{ inputs.compare }}
          FORCE: ${{ inputs.force }}
          LAYOUT: ${{ inputs.layout }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.kolkata_date }}" ]; then
            DATE="${{ inputs.kolkata_date }}"
          else
            DATE=$(TZ=Asia/Kolkata date +%F)
          fi
          if [ "$COMPARE" = "true" ] && [ "$LAYOUT" = "legacy" ]; then
            echo "compare=true requires a Bengali-first layout (a, b or c), not legacy."
            exit 1
          fi
          echo "kolkata_date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Date: $DATE"
          # Split flow (Phase 3): the row may be PLANNED (created by
          # plan_only) or PUBLISHED (legacy path). Anon RLS cannot see
          # a planned row, so read with the admin JWT (the "Admins read
          # publications" policy already covers it). The token is masked
          # immediately and lives only in this step.
          TOKEN_RESP=$(curl -s --max-time 30 -X POST "$REHEARSAL_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $REHEARSAL_ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\": \"$REHEARSAL_ADMIN_EMAIL\", \"password\": \"$REHEARSAL_ADMIN_PASSWORD\"}")
          ADMIN_TOKEN=$(echo "$TOKEN_RESP" | python3 -c "
          import json, sys
          print(json.load(sys.stdin).get('access_token') or '')
          ")
          if [ -z "$ADMIN_TOKEN" ]; then echo "Admin sign-in failed."; exit 1; fi
          echo "::add-mask::$ADMIN_TOKEN"
          ROW=$(curl -s --max-time 30 "$REHEARSAL_URL/rest/v1/daily_content_publications?kolkata_date=eq.$DATE&select=id,status,poster_url,poster_qc_status,poster_error,hadith_ref,hadith_source_line,cards" \
            -H "apikey: $REHEARSAL_ANON_KEY" -H "Authorization: Bearer $ADMIN_TOKEN")
          mkdir -p poster-out
          echo "$ROW" | python3 -c "
          import json, sys, os
          rows = json.load(sys.stdin)
          if not rows:
              print('NO PUBLICATION for', '$DATE', '— nothing to poster. Exiting cleanly.')
              sys.exit(3)
          r = rows[0]
          status = r.get('status')
          if status == 'failed':
              print('Publication is failed for', '$DATE', '— nothing to poster. Exiting cleanly.')
              sys.exit(3)
          if status not in ('planned', 'published'):
              print('Publication status is', status, '— nothing to poster. Exiting cleanly.')
              sys.exit(3)
          if r.get('poster_qc_status') == 'passed' and r.get('poster_url'):
              if os.environ.get('COMPARE') == 'true':
                  print('COMPARE mode: existing passed poster ignored — rendering a comparison copy.')
              else:
                  print('POSTER ALREADY EXISTS (QC passed) for', '$DATE', '— idempotent skip. Exiting cleanly.')
                  sys.exit(4)
          if r.get('poster_qc_status') == 'failed' and (r.get('poster_error') or '').startswith('quarantined:'):
              if os.environ.get('COMPARE') == 'true':
                  print('COMPARE mode: quarantined poster ignored — rendering a comparison copy (never touches the row).')
              elif os.environ.get('FORCE') == 'true':
                  print('FORCE: quarantined row re-attempted by explicit input — rendering anyway.')
              else:
                  print('QUARANTINED — needs review for', '$DATE', '— poster failed twice. No render. Exiting cleanly.')
                  sys.exit(3)
          plan_mode = 'true' if status == 'planned' else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('row_status=' + status + '\n')
              f.write('plan_mode=' + plan_mode + '\n')
          if status == 'planned':
              plan = {
                  'kolkata_date': '$DATE',
                  'hadith_ref': r.get('hadith_ref'),
                  'hadith_source_line': r.get('hadith_source_line'),
                  'cards': r.get('cards') or [],
              }
              with open('poster-out/plan.json', 'w') as f:
                  json.dump(plan, f)
              print('PLANNED row found — render will use ?plan=1 with poster-out/plan.json')
          else:
              print('Publication found:', r.get('hadith_source_line'), '| poster_qc_status:', r.get('poster_qc_status'))
          " || {
            CODE=$?
            if [ "$CODE" = "3" ] || [ "$CODE" = "4" ]; then
              echo "precheck_skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$CODE"
          }

      - name: Build app (demo routes enabled, rehearsal Supabase)
        if: steps.precheck.outputs.precheck_skip != 'true'
        env:
          VITE_ENABLE_DEMO_ROUTES: 'true'
          VITE_SUPABASE_URL: ${{ env.REHEARSAL_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.REHEARSAL_ANON_KEY }}
        run: |
          set -euo pipefail
          npm run build
          test -f dist/app.html || { echo "dist/app.html missing after build."; exit 1; }
          echo "Build OK (demo routes enabled for the poster-render route)."

      - name: Render + upload (adaptive pages x formats)
        if: steps.precheck.outputs.precheck_skip != 'true'
        env:
          DATE: ${{ steps.precheck.outputs.kolkata_date }}
          FORMATS: ${{ inputs.formats }}
          LAYOUT: ${{ inputs.layout }}
          COMPARE: ${{ inputs.compare }}
          PLAN_MODE: ${{ steps.precheck.outputs.plan_mode }}
        run: |
          set -euo pipefail
          # Split flow: a planned row renders from its plan JSON
          # (written by the pre-check from the admin read). Copy it
          # into dist/ before the server starts.
          if [ "$PLAN_MODE" = "true" ]; then
            test -f poster-out/plan.json || { echo "plan.json missing for a planned row."; exit 1; }
            cp poster-out/plan.json dist/poster-plan.json
            echo "Plan mode: dist/poster-plan.json ready for ?plan=1 renders."
          fi
          # Serve the built app (SPA fallback to app.html).
          node scripts/daily-content/poster/serve-dist.mjs 4173 > /tmp/serve-dist.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4173/demo/daily-content/poster-render; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:4173/demo/daily-content/poster-render || { echo "Static server did not come up."; cat /tmp/serve-dist.log; exit 1; }
          echo "Static server up (pid $SERVER_PID)."

          mkdir -p poster-out
          if [ "$PLAN_MODE" = "true" ]; then
            PLAN_PARAM="&plan=1"
          else
            PLAN_PARAM=""
          fi
          FAILED=""
          if [ "$COMPARE" = "true" ]; then
            # Compare mode: unchanged, non-adaptive single render per format.
            for FORMAT in $(echo "$FORMATS" | tr ',' ' '); do
              case "$FORMAT" in portrait|square|wide|story) ;; *) echo "Unknown format: $FORMAT"; FAILED="$FAILED $FORMAT"; continue ;; esac
              echo "=== format: $FORMAT ==="
              PNG="poster-out/poster-$DATE-$FORMAT.png"
              if ! node scripts/daily-content/poster/render-poster.mjs \
                  --url "http://127.0.0.1:4173/demo/daily-content/poster-render?date=$DATE&format=$FORMAT&layout=$LAYOUT$PLAN_PARAM" \
                  --out "$PNG" > "poster-out/render-$FORMAT.json"; then
                echo "Render FAILED for $FORMAT:"
                cat "poster-out/render-$FORMAT.json"
                FAILED="$FAILED $FORMAT"
                continue
              fi
              cat "poster-out/render-$FORMAT.json"
              echo "---"
              OBJECT_PATH="$DATE/compare/$LAYOUT-$FORMAT.png"
              if ! node scripts/daily-content/poster/upload-poster.mjs \
                  --file "$PNG" \
                  --object-path "$OBJECT_PATH" \
                  --supabase-url "$REHEARSAL_URL" \
                  --anon-key "$REHEARSAL_ANON_KEY" \
                  --admin-email "$REHEARSAL_ADMIN_EMAIL" \
                  --admin-password "$REHEARSAL_ADMIN_PASSWORD" > "poster-out/upload-$FORMAT.json"; then
                echo "Upload FAILED for $FORMAT:"
                cat "poster-out/upload-$FORMAT.json"
                FAILED="$FAILED $FORMAT"
                continue
              fi
              cat "poster-out/upload-$FORMAT.json"
              echo "---"
            done
          else
            # Adaptive mode: probe portrait page 1 to learn the mode +
            # pageCount, then render every (page, format) pair. The
            # probe IS page-1 portrait and is reused, never re-rendered.
            echo "=== adaptive probe: portrait page 1 ==="
            PROBE_PNG="poster-out/poster-$DATE-portrait-p1.png"
            PROBE_JSON="poster-out/render-portrait-p1.json"
            if ! node scripts/daily-content/poster/render-poster.mjs \
                --url "http://127.0.0.1:4173/demo/daily-content/poster-render?date=$DATE&format=portrait&layout=$LAYOUT&adaptive=1&page=1$PLAN_PARAM" \
                --out "$PROBE_PNG" > "$PROBE_JSON"; then
              echo "Probe render FAILED (portrait page 1):"
              cat "$PROBE_JSON"
              FAILED="$FAILED portrait-p1"
            else
              cat "$PROBE_JSON"
              echo "---"
              PAGE_COUNT=$(python3 -c "import json; a=json.load(open('$PROBE_JSON')).get('adaptive') or {}; print(a.get('pageCount') or '')")
              ADAPTIVE_MODE=$(python3 -c "import json; a=json.load(open('$PROBE_JSON')).get('adaptive') or {}; print(a.get('mode') or '')")
              case "$PAGE_COUNT" in 1|2|3) ;; *) echo "Adaptive plan missing or pageCount out of range (1-3): mode=$ADAPTIVE_MODE pageCount=$PAGE_COUNT"; FAILED="$FAILED portrait-p1" ;; esac
              if [ -z "$FAILED" ]; then
                echo "Adaptive mode: $ADAPTIVE_MODE, pages: $PAGE_COUNT"
                # Upload the probe PNG as page-1 portrait (object path
                # has no -p1 suffix, keeping the existing layout).
                if ! node scripts/daily-content/poster/upload-poster.mjs \
                    --file "$PROBE_PNG" \
                    --object-path "$DATE/portrait.png" \
                    --supabase-url "$REHEARSAL_URL" \
                    --anon-key "$REHEARSAL_ANON_KEY" \
                    --admin-email "$REHEARSAL_ADMIN_EMAIL" \
                    --admin-password "$REHEARSAL_ADMIN_PASSWORD" > "poster-out/upload-portrait-p1.json"; then
                  echo "Upload FAILED for portrait-p1:"
                  cat "poster-out/upload-portrait-p1.json"
                  FAILED="$FAILED portrait-p1"
                else
                  cat "poster-out/upload-portrait-p1.json"
                  echo "---"
                fi
              fi
              if [ -z "$FAILED" ]; then
                for PAGE in $(seq 1 "$PAGE_COUNT"); do
                  for FORMAT in $(echo "$FORMATS" | tr ',' ' '); do
                    case "$FORMAT" in portrait|square|wide|story) ;; *) echo "Unknown format: $FORMAT"; FAILED="$FAILED $FORMAT-p$PAGE"; continue ;; esac
                    if [ "$PAGE" = "1" ] && [ "$FORMAT" = "portrait" ]; then
                      continue
                    fi
                    echo "=== page $PAGE, format: $FORMAT ==="
                    PNG="poster-out/poster-$DATE-$FORMAT-p$PAGE.png"
                    RENDER_JSON="poster-out/render-$FORMAT-p$PAGE.json"
                    if ! node scripts/daily-content/poster/render-poster.mjs \
                        --url "http://127.0.0.1:4173/demo/daily-content/poster-render?date=$DATE&format=$FORMAT&layout=$LAYOUT&adaptive=1&page=$PAGE$PLAN_PARAM" \
                        --out "$PNG" > "$RENDER_JSON"; then
                      echo "Render FAILED for $FORMAT page $PAGE:"
                      cat "$RENDER_JSON"
                      FAILED="$FAILED $FORMAT-p$PAGE"
                      continue
                    fi
                    cat "$RENDER_JSON"
                    echo "---"
                    if [ "$PAGE" = "1" ]; then
                      OBJECT_PATH="$DATE/$FORMAT.png"
                    else
                      OBJECT_PATH="$DATE/$FORMAT-p$PAGE.png"
                    fi
                    if ! node scripts/daily-content/poster/upload-poster.mjs \
                        --file "$PNG" \
                        --object-path "$OBJECT_PATH" \
                        --supabase-url "$REHEARSAL_URL" \
                        --anon-key "$REHEARSAL_ANON_KEY" \
                        --admin-email "$REHEARSAL_ADMIN_EMAIL" \
                        --admin-password "$REHEARSAL_ADMIN_PASSWORD" > "poster-out/upload-$FORMAT-p$PAGE.json"; then
                      echo "Upload FAILED for $FORMAT page $PAGE:"
                      cat "poster-out/upload-$FORMAT-p$PAGE.json"
                      FAILED="$FAILED $FORMAT-p$PAGE"
                      continue
                    fi
                    cat "poster-out/upload-$FORMAT-p$PAGE.json"
                    echo "---"
                  done
                done
              fi
            fi
          fi
          if [ -n "$FAILED" ]; then
            echo "FAILED formats:$FAILED — stopping."
            if [ "$COMPARE" != "true" ]; then
              echo "Recording poster failure on the publication row."
              REASON="render_or_upload_failed:${FAILED# }"
              RESP=$(curl -s --max-time 60 -w '\n%{http_code}' -X POST "$REHEARSAL_URL/functions/v1/daily-content" \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer $REHEARSAL_CRON_SECRET" \
                -d "{\"action\":\"set_poster\",\"kolkata_date\":\"$DATE\",\"poster_qc_status\":\"failed\",\"poster_error\":\"$REASON\"}")
              echo "$RESP" | head -c 2000
              echo ""
            else
              echo "COMPARE mode: publication row untouched (no failure recorded)."
            fi
            echo "poster_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All formats rendered + uploaded."
          echo "poster_failed=false" >> "$GITHUB_OUTPUT"

      - name: Finalize asset via set_poster
        if: steps.precheck.outputs.precheck_skip != 'true' && inputs.compare != true
        env:
          DATE: ${{ steps.precheck.outputs.kolkata_date }}
          FORMATS: ${{ inputs.formats }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, json, os, re
          date = os.environ["DATE"]
          formats = [f.strip() for f in os.environ["FORMATS"].split(",") if f.strip()]
          # Every render in adaptive mode writes render-<format>-p<N>.json
          # (probe included). Finalize asserts the WHOLE SET: one mode,
          # one pageCount, one backgroundId across every page and format.
          probe = json.load(open("poster-out/render-portrait-p1.json"))
          assert probe.get("ok"), "probe render (portrait p1) not ok"
          adaptive = probe.get("adaptive") or {}
          page_count = adaptive.get("pageCount")
          assert page_count in (1, 2, 3), f"unexpected pageCount: {page_count}"
          mode = adaptive.get("mode")
          print(f"Adaptive set: mode={mode} pages={page_count} formats={formats}")
          urls, checksums, scene = {}, {}, None
          seen = set()
          for path in sorted(glob.glob("poster-out/render-*-p*.json")):
              m = re.match(r"poster-out/render-(.+)-p(\d)\.json$", path)
              assert m, f"unexpected render file: {path}"
              fmt, page = m.group(1), int(m.group(2))
              assert fmt in formats, f"render for unexpected format: {fmt}"
              assert 1 <= page <= page_count, f"render page out of range: {fmt} p{page} (count {page_count})"
              with open(path) as f:
                  r = json.load(f)
              assert r.get("ok"), f"render {fmt} p{page} not ok"
              a = r.get("adaptive") or {}
              assert a.get("pageCount") == page_count, f"pageCount mismatch on {fmt} p{page}: {a.get('pageCount')} vs {page_count}"
              assert a.get("mode") == mode, f"mode mismatch on {fmt} p{page}: {a.get('mode')} vs {mode}"
              if scene is None:
                  scene = r["backgroundId"]
              elif scene != r["backgroundId"]:
                  raise SystemExit(f"background mismatch across set: {scene} vs {r['backgroundId']} ({fmt} p{page})")
              with open(f"poster-out/upload-{fmt}-p{page}.json") as f:
                  u = json.load(f)
              assert u.get("ok"), f"upload {fmt} p{page} not ok"
              key = fmt if page == 1 else f"{fmt}-p{page}"
              urls[key] = u["publicUrl"]
              checksums[key] = u["checksum"]
              seen.add((fmt, page))
          expected = {(fmt, p) for fmt in formats for p in range(1, page_count + 1)}
          assert seen == expected, f"render set incomplete: missing {sorted(expected - seen)}, extra {sorted(seen - expected)}"
          assert "portrait" in urls, "portrait (primary) is required"
          body = {
              "action": "set_poster",
              "kolkata_date": date,
              "poster_qc_status": "passed",
              "poster_asset_id": f"poster:{date}",
              "poster_storage_path": f"daily-content-posters/{date}/portrait.png",
              "poster_url": urls["portrait"],
              "poster_urls": urls,
              "poster_checksum": checksums["portrait"],
              "poster_checksums": checksums,
              "poster_scene_id": scene,
          }
          with open("poster-out/set-poster-body.json", "w") as f:
              json.dump(body, f)
          print("set_poster body prepared; scene:", scene, "; pages:", sorted(urls))
          PYEOF
          RESP=$(curl -s --max-time 60 -w '\n%{http_code}' -X POST "$REHEARSAL_URL/functions/v1/daily-content" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $REHEARSAL_CRON_SECRET" \
            -d @poster-out/set-poster-body.json)
          CODE="${RESP##*$'\n'}"
          BODY_OUT="${RESP%$'\n'*}"
          echo "HTTP status: $CODE"
          echo "$BODY_OUT" | head -c 2000
          echo ""
          [ "$CODE" = "200" ] || { echo "set_poster did not return 200."; exit 1; }
          echo "$BODY_OUT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('ok') is True, d
          print('set_poster result:', d)
          "

      - name: Publish the planned row (split flow, step 3)
        if: steps.precheck.outputs.precheck_skip != 'true' && inputs.compare != true
        env:
          DATE: ${{ steps.precheck.outputs.kolkata_date }}
        run: |
          set -euo pipefail
          # Step 3 of the split flow: publish the row now that its poster
          # is finalized. The function refuses a row whose poster is not
          # QC-passed, and dedupes an already-published row (the legacy
          # path, where the row was published before the poster). The
          # first push goes out WITH the poster image.
          # A backfill date (DATE != today) never publishes: the function
          # always acts on today's row, so publishing here would target
          # the wrong day. A past-date row must already be published.
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "$DATE" != "$TODAY" ]; then
            echo "DATE ($DATE) is not today ($TODAY) — publish step skipped; the row must already be published."
            exit 0
          fi
          # Bounded retry (3 attempts) for transient failures. A
          # persistent failure leaves the row planned — the day is lost,
          # but nothing publishes without a QC-passed poster.
          for attempt in 1 2 3; do
            RESP=$(curl -s --max-time 60 -w '\n%{http_code}' -X POST "$REHEARSAL_URL/functions/v1/daily-content" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $REHEARSAL_CRON_SECRET" \
              -d '{"publish_planned": true}')
            CODE="${RESP##*$'\n'}"
            BODY_OUT="${RESP%$'\n'*}"
            echo "Publish attempt $attempt: HTTP $CODE"
            echo "$BODY_OUT" | head -c 2000
            echo ""
            if [ "$CODE" = "200" ]; then
              echo "$BODY_OUT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('ok') is True, d
          print('publish_planned result:', d)
          "
              exit 0
            fi
            sleep 20
          done
          echo "publish_planned did not return 200 after 3 attempts."
          exit 1

      - name: Verify finalized asset on the publication row
        if: steps.precheck.outputs.precheck_skip != 'true' && inputs.compare != true
        env:
          DATE: ${{ steps.precheck.outputs.kolkata_date }}
        run: |
          set -euo pipefail
          curl -s --max-time 30 "$REHEARSAL_URL/rest/v1/daily_content_publications?kolkata_date=eq.$DATE&select=kolkata_date,status,poster_asset_id,poster_storage_path,poster_url,poster_urls,poster_checksum,poster_scene_id,poster_qc_status,poster_generated_at" \
            -H "apikey: $REHEARSAL_ANON_KEY" -H "Authorization: Bearer $REHEARSAL_ANON_KEY" \
            | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          assert rows, 'publication row missing after set_poster'
          r = rows[0]
          assert r.get('status') == 'published', r
          assert r.get('poster_qc_status') == 'passed', r
          assert r.get('poster_url'), r
          assert r.get('poster_checksum'), r
          assert r.get('poster_asset_id') == 'poster:' + '$DATE', r
          expected = json.load(open('poster-out/set-poster-body.json'))['poster_urls'].keys()
          actual = r.get('poster_urls') or {}
          missing = [k for k in expected if k not in actual]
          assert not missing, f"poster_urls missing keys: {missing}"
          print('FINALIZED ASSET VERIFIED:')
          print(' asset_id:', r['poster_asset_id'])
          print(' storage_path:', r['poster_storage_path'])
          print(' poster_url:', r['poster_url'])
          print(' checksum:', r['poster_checksum'])
          print(' scene:', r['poster_scene_id'])
          print(' qc_status:', r['poster_qc_status'])
          print(' generated_at:', r['poster_generated_at'])
          print(' poster pages:', sorted(actual))
          "

      - name: Upload poster PNGs as artifacts
        if: always() && steps.precheck.outputs.precheck_skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: poster-${{ steps.precheck.outputs.kolkata_date }}-${{ inputs.layout }}
          path: poster-out/*.png
          retention-days: 30
