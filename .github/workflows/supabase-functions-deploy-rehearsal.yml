# Rehearsal-only deploy of the Phase 3 AI Adapter Edge Functions.
#
# Purpose: deploy the 5 migrated Edge Functions (Lovable removal, Phase 3)
# to the REHEARSAL Supabase project ONLY, without needing Supabase access
# from the agent environment. The deploy runs in GitHub Actions with the
# Supabase CLI, using the owner-created repo secret SUPABASE_ACCESS_TOKEN.
# Status: prepared 2026-11-14 for owner approval (Phase 4 gate). NOT
# dispatched. Do not dispatch until the owner approves it in its own
# message.
# What this workflow NEVER does:
#   - never targets production (the guard below pins the rehearsal
#     project ref as a literal; there is no production target, no
#     fallback, and no input that can change the target);
#   - never disables JWT verification;
#   - no database migration, no data write, no Cron registration,
#     no publication, no push notification;
#   - no secret is echoed, no `set -x`, no env dump anywhere.
#     GitHub also auto-masks the secret in logs.
# Design notes (each is a deliberate safety choice):
#   1. The project-ref guard is a LITERAL string comparison only.
#      It deliberately does NOT cross-check supabase/config.toml
#      project_id: on the checked-out phase3 branch that value is
#      the production project BY DESIGN, and that check would fail
#      every rehearsal run. The literal guard is the single source
#      of truth for the target.
#   2. No GitHub Environment is used: no `rehearsal` environment
#      exists in this repo (verified 2026-11-14 via gh api; the only
#      environments are the Vercel Preview/Production ones). The
#      workflow_dispatch confirm input (DEPLOY-REHEARSAL) is the
#      explicit approval. The owner may optionally create a
#      `rehearsal` environment with required reviewers later and add
#      `environment: rehearsal` to the job — the workflow does not
#      depend on it.
#   3. The 5 functions have no supabase/config.toml entries, so the
#      CLI deploys them with its default (JWT verification ON). The
#      smoke check therefore expects the gateway's 401 JSON, but it
#      ACCEPTS the function's own requireAdmin 401 JSON as well and
#      records which layer rejected the call — an OFF mode is a
#      finding to report, not a deploy failure (the function gate
#      still holds). Any other 401 body fails the run.
#   4. The shared `_shared/` Adapter code deploys automatically as
#      a dependency of the 5 functions; it is not deployed separately.
# Functions deployed (Phase 3, branch muse/phase3-adapter-2026-11-13):
#   enrich-dua-content, fix-dua-content, generate-dua-seo,
#   generate-hadith-seo, recommend-daily-content
# Deliberately NOT deployed by this workflow: every other function.
# In particular daily-content and scheduler-dispatch are NOT deployed
# here — they belong to the production deploy workflow only, and
# deploying them to rehearsal is out of scope for Phase 5.
# Prerequisites (owner actions, each its own approval):
#   1. This file enters the repo via the GitHub web upload (browser):
#      a git push of a workflow file is rejected because the available
#      token lacks the `workflow` scope (proven twice). Upload it to
#      .github/workflows/ on main.
#   2. Repo secret SUPABASE_ACCESS_TOKEN already exists by name
#      (created 2026-11-12; value never accessed). No new secret
#      is needed for this workflow.

name: Supabase Functions Deploy (rehearsal only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-REHEARSAL to deploy the 5 Phase 3 functions to REHEARSAL only'
        required: true
        type: string
        default: ''
      branch:
        description: 'Branch to deploy from (must be a Phase 3 adapter branch)'
        required: true
        type: string
        default: 'muse/phase3-adapter-2026-11-13'

permissions:
  contents: read

jobs:
  deploy-rehearsal:
    runs-on: ubuntu-latest
    env:
      CONFIRM_INPUT: ${{ inputs.confirm }}
      BRANCH_INPUT: ${{ inputs.branch }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "DEPLOY-REHEARSAL" ]; then
            echo "confirm input is not DEPLOY-REHEARSAL; refusing to run."
            exit 1
          fi
          case "$BRANCH_INPUT" in
            muse/phase3-adapter-*) ;;
            *) echo "branch must be a Phase 3 adapter branch (muse/phase3-adapter-*)."; exit 1 ;;
          esac
          echo "Inputs valid: rehearsal only, branch $BRANCH_INPUT."

      - name: Guard - rehearsal project ref only
        run: |
          set -euo pipefail
          # The rehearsal project ref is a literal. There is no other
          # target anywhere in this workflow, and no input can change it.
          EXPECTED_REF="cazdbxxffvdnsdatjsrx"
          OTHER_REF="llicfiepatzgllmjhzbw"
          REHEARSAL_URL="https://cazdbxxffvdnsdatjsrx.supabase.co"
          echo "Target project ref: $EXPECTED_REF (rehearsal only)"
          echo "Target URL: $REHEARSAL_URL"
          case "$REHEARSAL_URL" in
            *"$OTHER_REF"*) echo "URL contains the production ref. Refusing."; exit 1 ;;
          esac
          echo "REHEARSAL_REF=$EXPECTED_REF" >> "$GITHUB_ENV"
          echo "REHEARSAL_URL=$REHEARSAL_URL" >> "$GITHUB_ENV"

      - name: Require secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "SUPABASE_ACCESS_TOKEN secret is missing."; exit 1; fi
          echo "SUPABASE_ACCESS_TOKEN present."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - uses: actions/checkout@v4

      - name: Set Supabase access token (masked)
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "SUPABASE_ACCESS_TOKEN is set (masked)."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link rehearsal project
        run: |
          set -euo pipefail
          supabase link --project-ref "$REHEARSAL_REF"
          echo "Linked to rehearsal project $REHEARSAL_REF."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy 5 Phase 3 functions (rehearsal)
        run: |
          set -euo pipefail
          for fn in enrich-dua-content fix-dua-content generate-dua-seo generate-hadith-seo recommend-daily-content; do
            echo "--- deploying $fn ---"
            supabase functions deploy "$fn" --project-ref "$REHEARSAL_REF"
          done
          echo "All 5 functions deployed to rehearsal."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Smoke check - JWT verification ON (rehearsal)
        run: |
          set -euo pipefail
          # Unauthenticated call must be rejected with 401. Accept the
          # gateway 401 JSON ("Invalid JWT") or the function's own
          # requireAdmin 401 JSON; record which layer rejected it.
          # Any other status or 401 body fails the run.
          for fn in enrich-dua-content fix-dua-content generate-dua-seo generate-hadith-seo recommend-daily-content; do
            echo "--- smoke check $fn ---"
            GATEWAY_BODY=$(curl -s -w '\n%{http_code}' -X POST "$REHEARSAL_URL/functions/v1/$fn" -H "Content-Type: application/json" -d '{}')
            HTTP_CODE=$(printf '%s' "$GATEWAY_BODY" | tail -n 1)
            BODY=$(printf '%s' "$GATEWAY_BODY" | head -n -1)
            echo "HTTP $HTTP_CODE: $BODY"
            [ "$HTTP_CODE" = "401" ] || { echo "$fn: expected 401, got $HTTP_CODE."; exit 1; }
            MSG=$(printf '%s' "$BODY" | jq -r '.message // empty' 2>/dev/null || true)
            case "$MSG" in
              "Invalid JWT") echo "$fn: gateway rejected (JWT verification ON)." ;;
              *"Admin"*|*"admin"*) echo "$fn: function requireAdmin rejected (JWT verification ON at gateway, function gate holds)." ;;
              *) echo "$fn: unexpected 401 body: $BODY"; exit 1 ;;
            esac
          done
          echo "Smoke checks passed: all 5 functions reject unauthenticated calls with 401."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Supabase Functions Deploy (rehearsal only)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target project | \`cazdbxxffvdnsdatjsrx\` (rehearsal) |"
            echo "| Branch | \`$BRANCH_INPUT\` |"
            echo "| Functions | enrich-dua-content, fix-dua-content, generate-dua-seo, generate-hadith-seo, recommend-daily-content |"
            echo "| Job status | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
