# Phase E Plan-Only (production)
#
# PREPARED — production 3-dispatch chain (Phase 7 step 6). NOT YET IN
# THE REPO. Uploading this file to main needs its OWN owner approval
# (production change); do NOT upload it as part of any rehearsal work.
# Mirror of the main plan-only rehearsal workflow
# (phase-e-plan-only-rehearsal.yml, SHA-256
# 0892d81dfd83c177019d86de61827b51262725a8376537ce119ddccadc76afbe),
# adapted for production (see DIFFS.md in this directory).
#
# Calls the production daily-content function with {"plan_only": true} —
# step 1 of the Phase 3 split flow (plan -> poster -> publish_planned).
# Plans the day and inserts the row as `planned`, NEVER sends, NEVER
# flips to published. The poster workflow then finalizes onto the
# planned row, and the publish workflow calls publish_planned.
#
# PRODUCTION ONLY. Target is hardcoded to llicfiepatzgllmjhzbw. This
# workflow NEVER touches rehearsal (no rehearsal URL, no rehearsal
# secret, no rehearsal workflow). It is manual-dispatch only
# (workflow_dispatch, confirm=true); there is no schedule.
#
# Why this file exists: the production daily cron
# (phase-e-daily-cron-production.yml) is the SCHEDULED plan step
# (06:00 IST). This workflow is the MANUAL plan step — the first
# production split-flow day runs manually (Phase 7 runbook §5: 06:00
# plan_only by hand so every step is observable), and it is the
# recovery tool when the 06:00 schedule misses entirely. Unlike the
# daily cron, this workflow does NOT auto-dispatch the poster
# workflow — the operator dispatches it next, as in the rehearsal
# E2E. (A row planned here is also picked up automatically: the next
# 06:00 scheduled cron run reports deduped, reads the row, and
# dispatches the poster workflow itself — so a manually-planned row
# is never stranded.)
#
# Race note: if plan_only reports deduped, read the row below: a
# PUBLISHED row means the day is already published — nothing to do;
# no visible row means an earlier plan_only already planned it — the
# operator continues with the poster workflow (dispatch
# phase-e-poster-generate-production.yml, formats=portrait,square,
# layout=c). A FAILED row means no valid plan — the heal tick owns
# the recovery.
#
# Secrets required (repository secrets, created by the owner —
# names only, values never in any file):
#   PROD_CRON_SECRET - the CRON secret for the production
#     daily-content call (same value as DAILY_CONTENT_CRON_SECRET
#     in the production project; already exists)
#   PROD_ANON_KEY - the production project's anon key (read-only
#     PostgREST reads of the publication row; RLS shows published
#     rows only, so a planned row reads back empty — the function
#     response is the primary evidence, the row read is
#     corroboration for the published case). NEW prerequisite
#     (Phase 7 step 6).
#
# The secrets are masked with ::add-mask:: immediately and are NEVER
# echoed, logged, or written to any file. They live only in shell
# variables inside the single run step. The run response IS logged —
# it contains no credentials.
#
# Prerequisites:
#   1. This file enters the repo via the GitHub web upload (browser):
#      a git push of a workflow file is rejected because the available
#      token lacks the `workflow` scope. Upload it to
#      .github/workflows/ on main (exact file upload, never the web
#      editor paste — paste drifts whitespace).
#   2. The poster branch (muse/daily-poster-pipeline-2026-11-15) is
#      merged to main and deployed to production (Phase 7 steps 3–5).
#   3. Production daily_content_settings: plan_only fails closed while
#      paused (expected: {ok:false, reason:"paused"}). The owner
#      enables production with:
#        UPDATE daily_content_settings SET enabled = true WHERE id = 1;
#      on project llicfiepatzgllmjhzbw (dashboard noor-backend —
#      confirm the project NAME first). Pause it again afterwards
#      if the cutover is not active.

name: Phase E Plan-Only (production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type true to plan today in production (planned row only, no send, no publish)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan-only:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://llicfiepatzgllmjhzbw.supabase.co
      PROD_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
      PROD_CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
    steps:
      - name: Validate inputs and secrets
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "true" ]; then
            echo "confirm must be true for a manual run; aborting."
            exit 1
          fi
          for s in PROD_ANON_KEY PROD_CRON_SECRET; do
            if [ -z "${!s}" ]; then
              echo "$s is not set as a repository secret."
              exit 1
            fi
          done
          echo "::add-mask::$PROD_ANON_KEY"
          echo "::add-mask::$PROD_CRON_SECRET"
          echo "Inputs validated; secrets are present (values never shown)."
          echo "Target: production only (llicfiepatzgllmjhzbw)."

      - name: Plan-only (production)
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Kolkata date +%F)
          echo "Today (Asia/Kolkata): $TODAY"
          echo "--- publication row(s) for today BEFORE plan_only (anon read; RLS shows published rows only) ---"
          curl -s --max-time 30 "$PROD_URL/rest/v1/daily_content_publications?kolkata_date=eq.$TODAY&select=id,status,hadith_ref,poster_qc_status,poster_url,published_at" \
            -H "apikey: $PROD_ANON_KEY" -H "Authorization: Bearer $PROD_ANON_KEY"
          echo ""
          echo "--- plan_only ---"
          RESP=$(curl -s --max-time 90 -w '\n%{http_code}' -X POST "$PROD_URL/functions/v1/daily-content" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $PROD_CRON_SECRET" \
            -d '{"plan_only": true}')
          CODE="${RESP##*$'\n'}"
          BODY_OUT="${RESP%$'\n'*}"
          echo "HTTP status: $CODE"
          echo "Response:"
          echo "$BODY_OUT" | head -c 8000
          echo ""
          if [ "$CODE" = "401" ]; then
            echo "Unauthorised (401): the CRON_SECRET does not match the production project's secret."
            exit 1
          fi
          [ "$CODE" = "200" ] || { echo "Unexpected HTTP status $CODE."; exit 1; }
          echo "--- publication row(s) for today AFTER plan_only (anon read; a planned row is hidden by RLS) ---"
          curl -s --max-time 30 "$PROD_URL/rest/v1/daily_content_publications?kolkata_date=eq.$TODAY&select=id,status,hadith_ref,poster_qc_status,poster_url,published_at" \
            -H "apikey: $PROD_ANON_KEY" -H "Authorization: Bearer $PROD_ANON_KEY"
          echo ""
          echo "$BODY_OUT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('reason') == 'paused':
              print('PAUSED: production settings enabled=false. Nothing planned, nothing sent.')
              print('To run the split-flow day, the owner enables production (UPDATE daily_content_settings SET enabled = true WHERE id = 1).')
          elif d.get('planned') is True:
              print('PLANNED: a planned row was created for today. Nothing sent, nothing published.')
              print('Publication id:', d.get('publication_id'))
              print('Kolkata date:', d.get('kolkata_date'))
              print('Next: dispatch the poster workflow (planned row, formats=portrait,square, layout=c), then it dispatches the publish workflow.')
          elif d.get('deduped') is True:
              print('DEDUPED: a row already exists for today. Check the row read above:')
              print('- a PUBLISHED row means the day is already published — nothing to do.')
              print('- no visible row means an earlier plan_only already planned it — continue with the poster workflow.')
              print('- a FAILED row means no valid plan — the heal tick owns the recovery.')
          else:
              print('Unexpected response keys:', sorted(d.keys()))
              print('Full response:', json.dumps(d, ensure_ascii=False)[:2000])
          "
          echo "Plan-only complete (production only)."
