name: Upload Three Remaining Story Audio

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate sources only; do not upload"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  upload-three-story-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: |
          set -Eeuo pipefail
          test -n "$R2_ENDPOINT" && test -n "$R2_BUCKET"
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          test "$R2_BUCKET" = "noorapp-story-audio"
      - name: Download, validate, checksum, and upload
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/story-audio"
          : > three_story_upload_audit.tsv
          processed=0
          while IFS=$'\t' read -r source_name source_url slug content_type extension; do
            [ -n "$source_name" ] || continue
            file="$RUNNER_TEMP/story-audio/$source_name"
            curl --fail --location --retry 3 --retry-delay 2 --max-time 900 -o "$file" "$source_url"
            test -s "$file"
            file "$file" | grep -qi 'audio\|mpeg'
            bytes=$(stat -c '%s' "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\n' "$slug" "$bytes" "$sha256" "stories/$slug.$extension" >> three_story_upload_audit.tsv
            if [ "$DRY_RUN" != "true" ]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/stories/${slug}.${extension}" \
                --endpoint-url "$R2_ENDPOINT" \
                --content-type "$content_type" \
                --cache-control 'public, max-age=31536000, immutable' \
                --only-show-errors
              aws s3api head-object --bucket "$R2_BUCKET" --key "stories/${slug}.${extension}" --endpoint-url "$R2_ENDPOINT" >/dev/null
            fi
            processed=$((processed + 1))
          done < <(tail -n +2 new_3_story_r2_manifest.tsv)
          test "$processed" -eq 3
          echo "Processed $processed Story files"
      - uses: actions/upload-artifact@v4
        with:
          name: three-story-audio-audit-${{ github.run_number }}
          path: three_story_upload_audit.tsv
          retention-days: 30
