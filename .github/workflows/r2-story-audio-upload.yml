name: Upload Story Audio to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "Maximum number of files to process (0 = all)"
        required: false
        default: "0"
        type: string
      dry_run:
        description: "Download and validate only; do not upload to R2"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  upload-story-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          test -n "$R2_ENDPOINT" || { echo "Missing R2_ENDPOINT repository secret"; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing R2_BUCKET repository secret"; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing R2_ACCESS_KEY_ID repository secret"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing R2_SECRET_ACCESS_KEY repository secret"; exit 1; }
          test "$R2_BUCKET" = "noorapp-story-audio" || { echo "R2_BUCKET must be noorapp-story-audio"; exit 1; }

      - name: Install audio validation tools
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build upload manifest
        run: node scripts/build_r2_story_upload_manifest.mjs story_audio_drive_manifest.json story_audio_upload_manifest.tsv

      - name: Download, validate, and optionally upload Story audio
        env:
          MAX_FILES: ${{ inputs.max_files }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/story-audio"
          processed=0
          while IFS=$'\t' read -r drive_id source_name object_key content_type; do
            [ -n "$drive_id" ] || continue
            if [ "${MAX_FILES:-0}" != "0" ] && [ "$processed" -ge "${MAX_FILES}" ]; then break; fi
            file="$RUNNER_TEMP/story-audio/$drive_id"
            echo "Downloading: $source_name"
            curl --fail --location --retry 3 --retry-delay 2 --max-time 300 \
              -o "$file" "https://drive.usercontent.google.com/download?id=${drive_id}&export=download&confirm=t"
            test -s "$file"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$file" > "$file.duration"
            duration=$(cat "$file.duration")
            test -n "$duration"
            sha256sum "$file" >> story_audio_upload_checksums.txt
            echo "Validated ${source_name}; duration=${duration}s; key=${object_key}"
            if [ "${DRY_RUN}" != "true" ]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/${object_key}" \
                --endpoint-url "$R2_ENDPOINT" \
                --content-type "$content_type" \
                --cache-control "public, max-age=31536000, immutable" \
                --only-show-errors
            fi
            processed=$((processed + 1))
            rm -f "$file" "$file.duration"
          done < story_audio_upload_manifest.tsv
          echo "Processed $processed Story audio files"

      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: story-audio-upload-audit-${{ github.run_number }}
          path: |
            story_audio_upload_manifest.tsv
            story_audio_upload_checksums.txt
          if-no-files-found: error
          retention-days: 30
